name: CI

on:
  push:
  pull_request:

jobs:
  lite-tests:
    name: Lite edition tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-lite.txt
      - run: python -m unittest discover -s editions/lite/tests -p "test_*.py" -v

  production-tests:
    name: Production edition tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m pytest -v
