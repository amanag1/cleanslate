services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cleanslate
      POSTGRES_USER: cleanslate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanslate -d cleanslate"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cleanslate:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cleanslate
      CLEANSLATE_MAX_UPLOAD_BYTES: "26214400"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  ui:
    build: .
    command: ["streamlit", "run", "src/cleanslate/ui/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  postgres_data:
